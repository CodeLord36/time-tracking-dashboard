<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <!-- download font stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <title>Frontend Mentor | Time tracking dashboard</title>
  </head>
  <body>
    <main class="container">
      <aside class="profile">
        <section class="profile-info">
          <img
            src="/images/image-jeremy.png"
            alt="Profile picture of Jeremy Robson"
            class="profile-picture"
          />
          <div class="profile-text">
            <p class="profile-report">Report for</p>
            <h1 class="profile-name">Jeremy Robson</h1>
          </div>
        </section>
        <div class="time-frames">
          <button class="time-frame-btn" data-timeframe="daily">Daily</button>
          <button class="time-frame-btn active" data-timeframe="weekly">
            Weekly
          </button>
          <button class="time-frame-btn" data-timeframe="monthly">
            Monthly
          </button>
        </div>
      </aside>
      <section class="activity-card activity-card--work" data-activity="Work">
        <div class="activity-card__header">
          <img
            src="/images/icon-work.svg"
            alt="work-svg"
            class="activity-card__icon"
          />
        </div>
        <article class="activity-card__content">
          <div class="activity-card__top">
            <h2 class="activity-card__title">Work</h2>
            <button class="activity-card__menu">
              <img
                src="/images/icon-ellipsis.svg"
                alt=""
                class="activity-card__svg"
              />
            </button>
          </div>
          <div class="activity-card__bottom">
            <p class="activity-card__hours">0hrs</p>
            <p class="activity-card__previous">0hrs</p>
          </div>
        </article>
      </section>
      <section class="activity-card activity-card--play" data-activity="Play">
        <div class="activity-card__header">
          <img
            src="/images/icon-play.svg"
            alt="play-svg"
            class="activity-card__icon"
          />
        </div>
        <article class="activity-card__content">
          <div class="activity-card__top">
            <h2 class="activity-card__title">Play</h2>
            <button class="activity-card__menu">
              <img
                src="/images/icon-ellipsis.svg"
                alt=""
                class="activity-card__svg"
              />
            </button>
          </div>
          <div class="activity-card__bottom">
            <p class="activity-card__hours">0hrs</p>
            <p class="activity-card__previous">0hrs</p>
          </div>
        </article>
      </section>
      <section class="activity-card activity-card--study" data-activity="Study">
        <div class="activity-card__header">
          <img
            src="/images/icon-study.svg"
            alt="study-svg"
            class="activity-card__icon"
          />
        </div>
        <article class="activity-card__content">
          <div class="activity-card__top">
            <h2 class="activity-card__title">Study</h2>
            <button class="activity-card__menu">
              <img
                src="/images/icon-ellipsis.svg"
                alt=""
                class="activity-card__svg"
              />
            </button>
          </div>
          <div class="activity-card__bottom">
            <p class="activity-card__hours">0hrs</p>
            <p class="activity-card__previous">0hrs</p>
          </div>
        </article>
      </section>
      <section
        class="activity-card activity-card--exercise"
        data-activity="Exercise"
      >
        <div class="activity-card__header">
          <img
            src="/images/icon-exercise.svg"
            alt="exercise-svg"
            class="activity-card__icon"
          />
        </div>
        <article class="activity-card__content">
          <div class="activity-card__top">
            <h2 class="activity-card__title">Exercise</h2>
            <button class="activity-card__menu">
              <img
                src="/images/icon-ellipsis.svg"
                alt=""
                class="activity-card__svg"
              />
            </button>
          </div>
          <div class="activity-card__bottom">
            <p class="activity-card__hours">0hrs</p>
            <p class="activity-card__previous">0hrs</p>
          </div>
        </article>
      </section>
      <section
        class="activity-card activity-card--social"
        data-activity="Social"
      >
        <div class="activity-card__header">
          <img
            src="/images/icon-social.svg"
            alt="social-svg"
            class="activity-card__icon"
          />
        </div>
        <article class="activity-card__content">
          <div class="activity-card__top">
            <h2 class="activity-card__title">Social</h2>
            <button class="activity-card__menu">
              <img
                src="/images/icon-ellipsis.svg"
                alt=""
                class="activity-card__svg"
              />
            </button>
          </div>
          <div class="activity-card__bottom">
            <p class="activity-card__hours">0hrs</p>
            <p class="activity-card__previous">0hrs</p>
          </div>
        </article>
      </section>
      <section
        class="activity-card activity-card--self-care"
        data-activity="Self Care"
      >
        <div class="activity-card__header">
          <img
            src="/images/icon-self-care.svg"
            alt="self-care-svg"
            class="activity-card__icon"
          />
        </div>
        <article class="activity-card__content">
          <div class="activity-card__top">
            <h2 class="activity-card__title">Self Care</h2>
            <button class="activity-card__menu">
              <img
                src="/images/icon-ellipsis.svg"
                alt=""
                class="activity-card__svg"
              />
            </button>
          </div>
          <div class="activity-card__bottom">
            <p class="activity-card__hours">0hrs</p>
            <p class="activity-card__previous">0hrs</p>
          </div>
        </article>
      </section>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="https://github.com/CodeLord36">CodeLord36</a>.
    </footer>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
