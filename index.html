<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <!-- download font stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <title>Frontend Mentor | Time tracking dashboard</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <main>
      <aside>
        <div>
          <p>Report for</p>
          <h1>Jeremy Robson</h1>
        </div>
        <div>
          <button>Daily</button>
          <button>Weekly</button>
          <button>Monthly</button>
        </div>
      </aside>
      <section>
        <article>
          <div>
            <h2>Work</h2>
            <img src="" alt="" />
          </div>
          <div>
            <p class="time-current">5hrs</p>
            <p class="time-previous">5hrs</p>
          </div>
        </article>
        <article>
          <div>
            <h2>Play</h2>
            <img src="" alt="" />
          </div>
          <div>
            <p class="time-current">5hrs</p>
            <p class="time-previous">5hrs</p>
          </div>
        </article>
        <article>
          <div>
            <h2>Study</h2>
            <img src="" alt="" />
          </div>
          <div>
            <p class="time-current">5hrs</p>
            <p class="time-previous">5hrs</p>
          </div>
        </article>
        <article>
          <div>
            <h2>Exercise</h2>
            <img src="" alt="" />
          </div>
          <div>
            <p class="time-current">5hrs</p>
            <p class="time-previous">5hrs</p>
          </div>
        </article>
        <article>
          <div>
            <h2>Social</h2>
            <img src="" alt="" />
          </div>
          <div>
            <p class="time-current">5hrs</p>
            <p class="time-previous">5hrs</p>
          </div>
        </article>
        <article>
          <div>
            <h2>Self Care</h2>
            <img src="" alt="" />
          </div>
          <div>
            <p class="time-current">5hrs</p>
            <p class="time-previous">5hrs</p>
          </div>
        </article>
      </section>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
